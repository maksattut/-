<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заявки</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fb;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

table {
  width: 100%;
  background: white;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

h2 {
  text-align: center;
}

a {
  color: #2d6cdf;
}
</style>

<script>
const PASSWORDS = {
  logist: "1234",
  director: "9999"
};

// проверка доступа
const params = new URLSearchParams(window.location.search);
const role = params.get("role");

if (!role || !PASSWORDS[role]) {
  alert("Нет доступа");
  window.location.href = "index.html";
}
</script>

</head>

<body>

<div class="container">

<h2>Список заявок</h2>

<a href="index.html">← Назад</a><br><br>

<tr>
  <th>ID</th>
  <th>Дата</th>
  <th>Цех</th>

  <th></th>
</tr>
</table>

</div>

<script src="js/list.js"></script>

</body>
</html>
