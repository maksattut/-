<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заявки</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  margin: 0;
}

.header {
  background: #2d6cdf;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.container {
  padding: 15px;
}

/* карточка */
.card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.label {
  color: #777;
  font-size: 13px;
}

.value {
  font-weight: bold;
}

/* статус */
.status {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  display: inline-block;
}

.pending {
  background: #ffe0b2;
  color: #e65100;
}

.logist {
  background: #bbdefb;
  color: #0d47a1;
}

.approved {
  background: #c8e6c9;
  color: #1b5e20;
}

/* кнопки */
.btn {
  padding: 10px;
  border: none;
  border-radius: 8px;
  margin-top: 10px;
  width: 100%;
  cursor: pointer;
}

.approve {
  background: #4caf50;
  color: white;
}

.reject {
  background: #f44336;
  color: white;
}

.back {
  margin-bottom: 10px;
  display: inline-block;
  color: #2d6cdf;
}
</style>

<script>
const PASSWORDS = {
  logist: "1234",
  director: "9999"
};

const params = new URLSearchParams(window.location.search);
const role = params.get("role");

if (!role || !PASSWORDS[role]) {
  alert("Нет доступа");
  location.href = "index.html";
}
</script>

</head>

<body>

<div class="header">📋 Заявки</div>

<div class="container">

<a class="back" href="index.html">← Назад</a>

<div id="list"></div>

</div>

<script src="js/list.js"></script>

</body>
</html>
